<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1830">
<meta name="description" content="A small Japanese story-walk for JLPT N2 action verbs.">
<title>Lantern Alley</title>
<link rel="icon" href="lantern-alley.ico">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignores the manifest, so it needs its own tags. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lantern Alley">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="glow-orb a"></div>
<div class="glow-orb b"></div>
<div class="glow-orb c"></div>

<div class="stage">

  <section id="screen-title" class="frame title-scene">
    <div class="title-scene-shade" aria-hidden="true"></div>
    <div class="title-copy">
      <p class="title-kicker">Japanese story adventure</p>
      <h1 class="jp">言葉の路地</h1>
      <p class="title-english">LANTERN ALLEY</p>
    </div>
    <div class="title-kon">
      <img src="assets/fox/fox-neutral-no-mouth-transparent.webp" alt="コン">
    </div>
    <div class="title-entry-panel">
      <div id="progress-note" class="progress-note" hidden></div>
      <div class="title-actions">
        <button class="btn btn-primary" id="btn-start">路地へ入る</button>
        <button class="btn btn-ghost" id="btn-restart" hidden>最初から</button>
      </div>
    </div>
  </section>

  <section id="screen-map" class="frame map-frame">
    <div class="map-top">
      <div class="map-heading">
        <h2>言葉の路地</h2>
        <span>行きたい場所を選んでください</span>
      </div>
      <div class="map-progress" aria-label="路地の進み具合">
        <span class="map-progress-lantern" aria-hidden="true"></span>
        <span id="map-progress-text">灯り 0 / 6</span>
        <button class="btn btn-ghost map-detail-practice" id="map-detail-practice" hidden>コンの稽古</button>
      </div>
    </div>

    <div class="map-scene" id="map-scene" role="group" aria-label="行き先を選んでください">
      <div id="map-destinations"></div>
    </div>

    <div class="map-detail" id="map-detail" aria-live="polite">
      <img class="map-kon" src="assets/fox/fox-neutral-no-mouth-transparent.webp" alt="コン">
      <div class="map-detail-copy">
        <span class="map-detail-status" id="map-detail-status"></span>
        <h3 class="map-detail-name" id="map-detail-name"></h3>
        <p class="map-detail-story" id="map-detail-story"></p>
        <p class="map-detail-focus" id="map-detail-focus"></p>
      </div>
      <button class="btn btn-primary map-detail-action" id="map-detail-action"></button>
    </div>
  </section>

  <section id="screen-game" class="frame">
    <div class="game-layout">
      <div class="stage-bar">
        <div class="hud">
          <button class="breadcrumb" id="btn-back-map">&larr; Lantern Alley</button>
          <div class="hud-hearts" id="hud-hearts" aria-label="Hearts remaining"></div>
          <div class="hud-stars"><span id="hud-star-count">0</span> <span>⭐</span></div>
        </div>

        <div class="stage-meta">
          <div class="scene-label" id="scene-label">Location</div>
          <div class="stage-phase-row" id="stage-phase-row">
            <span class="stage-phase-badge" id="stage-phase-badge">Learn</span>
            <button class="btn btn-ghost stage-restart" id="btn-restart-learn">Restart from Learn</button>
            <button class="btn btn-ghost stage-skip-day" id="btn-skip-day" title="Testing only: jump to the next day">Skip to next day (test)</button>
            <button class="btn btn-ghost stage-skip-day" id="btn-preview-episode" title="Testing only: preview Episode 1 in the new question format">Preview Episode 1 (test)</button>
          </div>
          <div class="encounter-status" id="encounter-status">Encounter <span id="encounter-progress">1</span> of <span id="encounter-total">5</span></div>
          <div class="entrance-progress" id="entrance-progress" hidden>路地の入口 <span id="entrance-progress-current">1</span> / 3</div>
        </div>
      </div>

      <div class="learning-context">
        <p class="narration" id="narration"></p>

        <div class="romaji-toggle">
          <span>ふりがな &mdash; show romaji</span>
          <button class="switch on" id="romaji-switch" aria-pressed="true" aria-label="Toggle romaji"></button>
        </div>

        <div class="dialogue" id="dialogue-shell">
          <div class="avatar" id="avatar-slot">🦊</div>
          <div class="speech" id="dialogue-panel" role="button" tabindex="-1" aria-label="コンの会話">
            <div class="speech-top">
              <div class="jp-line jp" id="jp-line"></div>
            </div>
            <div class="romaji-line" id="romaji-line"></div>
            <div class="meaning-line" id="meaning-line"></div>
            <span class="dialogue-continue" id="dialogue-continue" aria-hidden="true"></span>
          </div>
          <button class="speak-btn" id="speak-btn" title="Play audio" aria-label="Play Japanese audio">🔊</button>
        </div>
      </div>

      <div class="answer-workspace">
        <div class="scene" id="scene"></div>

        <button class="hint-btn" id="hint-btn">Need a hint?</button>
        <div class="hint-box" id="hint-box"></div>

        <div class="feedback-row" id="feedback-row">
          <div class="stamp" id="stamp"></div>
          <div class="feedback-text" id="feedback-text"></div>
        </div>

        <div class="next-row" id="next-row" style="display:none;">
          <button class="btn btn-primary" id="btn-next">Back to the Alley &rarr;</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="credits">Lantern Alley &middot; a small Japanese story-walk</footer>
</div>

<script src="curriculum-catalog.js"></script>
<script src="learning-content.js"></script>
<script src="review-engine.js"></script>
<script src="learning-progress.js"></script>
<script src="question-renderer.js"></script>
<script src="catalog-practice.js"></script>
<script src="entrance-stage-logic.js"></script>
<script src="moonview-inn-interactions.js"></script>
<script src="n2-home-inn-stage.js"></script>
<script src="n2-inn-episodes.js"></script>
    <script src="n2-market-episodes.js"></script>
    <script src="n2-teahouse-episodes.js"></script>
    <script src="n2-station-episodes.js"></script>
    <script src="n2-shrine-episodes.js"></script>
<script src="audio-index.js"></script>
<script src="lantern-map.js"></script>
<script src="app.js"></script>

<script>
  // Service workers need http(s); opening this file directly with file://
  // simply skips registration and the game still runs online.
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(err){
        console.warn("Offline support unavailable:", err.message);
      });
    });
  }
</script>

</body>
</html>
