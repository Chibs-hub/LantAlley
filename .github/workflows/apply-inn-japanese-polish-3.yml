name: Apply verified Inn Japanese polish 3

on:
  push:
    branches:
      - codex/inn-learning-redesign
    paths:
      - .github/workflows/apply-inn-japanese-polish-3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/inn-learning-redesign
      - name: Apply exact verified 延期 correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          episodes = Path('n2-inn-episodes.js')
          text = episodes.read_text(encoding='utf-8')
          replacements = [
              ('{type:"sentence-order", options:["明日の","来週に","延期する","催しは"], correctIndex:2}',
               '{type:"sentence-order", options:["明日の","来週に","延期する","催しを"], correctIndex:2}'),
              ('「明日の催しは来週に延期することになりました」となります。★は「延期する」です。',
               '「明日の催しを来週に延期することになりました」となります。★は「延期する」です。'),
              ('「明日の」「催しは」「来週に」「延期する」の順に並びます。★は四番目です。',
               '「明日の」「催しを」「来週に」「延期する」の順に並びます。★は四番目です。'),
              ('"催しは is the topic, so it comes second"',
               '"催しを completes 明日の催しを, so it comes second"'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          episodes.write_text(text, encoding='utf-8')

          tests = Path('n2-inn-japanese.test.mjs')
          text = tests.read_text(encoding='utf-8')
          marker = '    "仕事を責任を持って受ける"\n'
          replacement = '    "仕事を責任を持って受ける",\n    "明日の催しは来週に延期することになりました"\n'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one regression-list marker, found {text.count(marker)}')
          text = text.replace(marker, replacement)

          anchor = 'test("the ledger wording distinguishes finished work from an ongoing shipment", () => {'
          new_test = '''test("延期 sentence order uses the event as the object of 延期する", () => {\n  const context = loadInn();\n  const q = question(context, "inn-e02", "inn-e02-q07");\n  assert.equal(q.answer.options[3], "催しを");\n  assert.match(q.feedback.correct, /明日の催しを来週に延期することになりました/);\n  assert.doesNotMatch(q.feedback.correct, /催しは来週に延期する/);\n});\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one test anchor, found {text.count(anchor)}')
          text = text.replace(anchor, new_test + anchor)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: node --check n2-inn-episodes.js
      - name: Run Japanese regression tests
        run: node --test n2-inn-japanese.test.mjs
      - name: Confirm only intended files changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          expected=$'n2-inn-episodes.js\nn2-inn-japanese.test.mjs'
          test "$changed" = "$expected" || { echo "Unexpected diff:"; printf '%s\n' "$changed"; exit 1; }
          git diff --check
      - name: Commit verified correction and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n2-inn-episodes.js n2-inn-japanese.test.mjs
          git rm .github/workflows/apply-inn-japanese-polish-3.yml
          git commit -m "Fix Inn 延期 sentence grammar"
          git push origin HEAD:codex/inn-learning-redesign
