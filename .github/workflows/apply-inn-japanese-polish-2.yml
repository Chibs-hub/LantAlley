name: Apply verified Inn Japanese polish 2

on:
  push:
    branches:
      - codex/inn-learning-redesign
    paths:
      - .github/workflows/apply-inn-japanese-polish-2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/inn-learning-redesign
      - name: Apply exact verified Japanese correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stage = Path('n2-home-inn-stage.js')
          text = stage.read_text(encoding='utf-8')
          old = 'はい、明日の朝食の配膳をお願いします。仕事を責任を持って受けるのが「引き受ける」です。'
          new = 'はい、明日の朝食の配膳をお願いします。責任を持って仕事を受けるのが「引き受ける」です。'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one occurrence, found {count}')
          stage.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('n2-inn-japanese.test.mjs')
          text = tests.read_text(encoding='utf-8')
          marker = '    "三番から六番のお部屋のお布団を引き受けて"\n'
          replacement = '    "三番から六番のお部屋のお布団を引き受けて",\n    "仕事を責任を持って受ける"\n'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one regression-list marker, found {text.count(marker)}')
          tests.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: node --check n2-home-inn-stage.js
      - name: Run Japanese regression tests
        run: node --test n2-inn-japanese.test.mjs
      - name: Confirm only intended files changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          expected=$'n2-home-inn-stage.js\nn2-inn-japanese.test.mjs'
          test "$changed" = "$expected" || { echo "Unexpected diff:"; printf '%s\n' "$changed"; exit 1; }
          git diff --check
      - name: Commit verified correction and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n2-home-inn-stage.js n2-inn-japanese.test.mjs
          git rm .github/workflows/apply-inn-japanese-polish-2.yml
          git commit -m "Polish Inn 引き受ける feedback"
          git push origin HEAD:codex/inn-learning-redesign
